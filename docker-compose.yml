services:
  db:
    image: postgres:15-alpine
    container_name: index-aeli-postgres-global
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-index_aeli_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-global:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-index_aeli_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./index-aeli-api
      dockerfile: services/api-gateway/Dockerfile
    container_name: index-aeli-api-gateway-global
    restart: always
    ports:
      - "${GATEWAY_PORT:-7009}:7009"
    environment:
      PORT: 7009
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey123!}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/index_aeli_db?sslmode=disable}
      IDENTITY_SERVICE_URL: http://identity-service:7010
      CONTENT_SERVICE_URL: http://content-service:7011
      PROGRAM_SERVICE_URL: http://program-service:7012
      MEDIA_SERVICE_URL: http://media-service:7013
    depends_on:
      db:
        condition: service_healthy

  identity-service:
    build:
      context: ./index-aeli-api
      dockerfile: services/identity-service/Dockerfile
    container_name: index-aeli-identity-service-global
    restart: always
    ports:
      - "${IDENTITY_PORT:-7010}:7010"
    environment:
      PORT: 7010
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/index_aeli_db?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey123!}
    depends_on:
      db:
        condition: service_healthy

  content-service:
    build:
      context: ./index-aeli-api
      dockerfile: services/content-service/Dockerfile
    container_name: index-aeli-content-service-global
    restart: always
    ports:
      - "${CONTENT_PORT:-7011}:7011"
    environment:
      PORT: 7011
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/index_aeli_db?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy

  program-service:
    build:
      context: ./index-aeli-api
      dockerfile: services/program-service/Dockerfile
    container_name: index-aeli-program-service-global
    restart: always
    ports:
      - "${PROGRAM_PORT:-7012}:7012"
    environment:
      PORT: 7012
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/index_aeli_db?sslmode=disable}
      CONTENT_SERVICE_URL: http://content-service:7011
    depends_on:
      db:
        condition: service_healthy

  media-service:
    build:
      context: ./index-aeli-api
      dockerfile: services/media-service/Dockerfile
    container_name: index-aeli-media-service-global
    restart: always
    ports:
      - "${MEDIA_PORT:-7013}:7013"
    environment:
      PORT: 7013
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/index_aeli_db?sslmode=disable}
      GATEWAY_URL: http://api-gateway:7009
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media-uploads-global:/app/uploads

  cms:
    build:
      context: ./index-aeli-cms
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7009}
    container_name: index-aeli-cms-global
    restart: always
    ports:
      - "${CMS_PORT:-7008}:7008"
    environment:
      PORT: 7008
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7009}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api-gateway:7009}
    depends_on:
      - api-gateway

  web:
    build:
      context: ./index-aeli-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7009}
        NEXT_PUBLIC_TAX_PERCENT: ${NEXT_PUBLIC_TAX_PERCENT:-10}
    container_name: index-aeli-web-global
    restart: always
    ports:
      - "${WEB_PORT:-7007}:7007"
    environment:
      PORT: 7007
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7009}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api-gateway:7009}
      NEXT_PUBLIC_TAX_PERCENT: ${NEXT_PUBLIC_TAX_PERCENT:-10}
    depends_on:
      - api-gateway

volumes:
  pgdata-global:
  media-uploads-global:
